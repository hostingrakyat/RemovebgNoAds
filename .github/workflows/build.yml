name: Build

on:
  push:
    branches:
      - "claude/removebg-no-ads-mobile-dHACP"
      - "main"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.24.5"
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Configure local.properties
        run: |
          mkdir -p android
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_HOME"
          } > android/local.properties

      - name: Generate Gradle wrapper (8.7)
        run: |
          set -euo pipefail
          curl -sLO https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          # Generate the wrapper in a throwaway minimal Gradle build so it
          # never evaluates the Flutter settings.gradle, then copy into android/.
          mkdir -p /tmp/wrap
          echo "rootProject.name = 'wrap'" > /tmp/wrap/settings.gradle
          (cd /tmp/wrap && "$GITHUB_WORKSPACE/gradle-8.7/bin/gradle" wrapper --gradle-version 8.7 --distribution-type bin)
          mkdir -p android/gradle/wrapper
          cp /tmp/wrap/gradlew android/gradlew
          cp /tmp/wrap/gradlew.bat android/gradlew.bat || true
          cp /tmp/wrap/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          cp /tmp/wrap/gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/gradle-wrapper.properties
          chmod +x android/gradlew
          rm -rf gradle-8.7 gradle-8.7-bin.zip

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode keystore (only if secret is set)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-key.jks
          echo "Keystore present -> release will be SIGNED."

      - name: No keystore notice
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: echo "No KEYSTORE_BASE64 secret -> release will be UNSIGNED (no debug fallback)."

      - name: Build APK (release)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Build AAB (release)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/*-release*.apk dist/ 2>/dev/null || true
          cp build/app/outputs/bundle/release/*.aab dist/ 2>/dev/null || true
          ls -la dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: removebgnoads-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: day5-build-${{ github.run_number }}
          name: Removebg No Ads · Day 5 · build ${{ github.run_number }}
          body: |
            Removebg No Ads — Day 5 of the 365 Days App Challenge.
            Free · No Ads · Offline · HD background remover.

            Attached: release APK + AAB.
            (Debug-signed unless release signing secrets are configured — install the APK via "allow from unknown sources".)
          files: dist/*
          draft: false
          prerelease: false
