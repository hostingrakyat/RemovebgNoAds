name: Generate Keystore

# Run this ONCE manually. It generates an upload keystore and prints the four
# values you must copy into repository secrets (Settings → Secrets → Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Nothing is committed. After secrets are set, build.yml signs the release.

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: "Key alias"
        required: true
        default: "upload"
      validity_days:
        description: "Validity (days)"
        required: true
        default: "10000"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate JKS keystore
        run: |
          set -euo pipefail
          ALIAS="${{ github.event.inputs.key_alias }}"
          DAYS="${{ github.event.inputs.validity_days }}"
          STORE_PW="$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)"
          KEY_PW="$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)"

          keytool -genkeypair \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 \
            -validity "$DAYS" \
            -storetype JKS \
            -keystore upload-key.jks \
            -storepass "$STORE_PW" \
            -keypass "$KEY_PW" \
            -dname "CN=Riovan Styx Roring, OU=ITK, O=365 Days App Challenge, L=Balikpapan, S=Kalimantan Timur, C=ID"

          B64="$(base64 -w0 upload-key.jks)"

          {
            echo "## 🔐 Keystore generated"
            echo ""
            echo "Copy these into **Settings → Secrets and variables → Actions → New repository secret**:"
            echo ""
            echo "| Secret | Value |"
            echo "| --- | --- |"
            echo "| \`KEYSTORE_PASSWORD\` | \`$STORE_PW\` |"
            echo "| \`KEY_ALIAS\` | \`$ALIAS\` |"
            echo "| \`KEY_PASSWORD\` | \`$KEY_PW\` |"
            echo ""
            echo "<details><summary><code>KEYSTORE_BASE64</code> (click to expand)</summary>"
            echo ""
            echo "\`\`\`"
            echo "$B64"
            echo "\`\`\`"
            echo "</details>"
            echo ""
            echo "> Manual fallback: download the base64 above, \`base64 -d\` it back to \`upload-key.jks\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload keystore base64 (manual fallback artifact)
        run: |
          base64 -w0 upload-key.jks > keystore.base64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: keystore.base64.txt
          retention-days: 1
