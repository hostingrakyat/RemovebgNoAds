name: removebgnoads
description: "Removebg No Ads — free, offline, on-device background remover. HD output. No ads. Forever."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # On-device segmentation via ONNX Runtime + a bundled U^2-Net model
  # (silueta.onnx, ~42 MB, shipped in assets). Fully offline, no Google Play
  # Services and no first-run download. ffiPlugin; compatible with Dart 3.5.4.
  onnxruntime: ^1.4.1

  # Image composition / mask->alpha / PNG-JPG encode
  image: ^4.2.0

  # Pick from gallery / capture from camera
  image_picker: ^1.1.2

  # Save to device gallery: handled via a small MediaStore MethodChannel in
  # MainActivity.kt (no plugin) — keeps the Flutter 3.24.5 gradle stack clean.

  # Share output
  share_plus: ^10.0.2

  # Runtime permissions (camera + photos)
  permission_handler: ^11.3.1

  # File paths / recents storage
  path_provider: ^2.1.4
  path: ^1.9.0

  # Open social links
  url_launcher: ^6.3.0

  # Persist language + recents index
  shared_preferences: ^2.3.2

  # Solid-color background picker
  flutter_colorpicker: ^1.1.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/silueta.onnx
